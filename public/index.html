<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1912">
<meta name="description" content="Sopravvivi nel bosco, da solo o con la comunità: raccogli legna, accendi il falò e resisti ai lupi notte dopo notte.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230e1912%22/%3E%3Cpath d=%22M16 5c3 5 7 8 7 14a7 7 0 0 1-14 0c0-4 2-6 4-8 0 3 1 4 3 5 0-4-1-7 0-11z%22 fill=%22%23ff8a3d%22/%3E%3C/svg%3E">
<title>L'Ultimo Falò</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: gioco a schermo singolo — HUD dei bisogni in alto, bosco su canvas con joystick e pulsante azione, zaino in basso; i pannelli coprono il bosco e mettono in pausa */
:root{
  --pine:#0e1912; --moss:#18291e; --panel:#1d3124; --line:#33503c;
  --birch:#ece6d3; --lichen:#a5b39b;
  --ember:#ff8a3d; --hp:#e5484d; --food:#e0a43a; --water:#4fb3d9; --warm:#f2683a; --xp:#b5d86b;
  --f-display:'Special Elite','Courier New',ui-monospace,monospace;
  --f-body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;background:var(--pine);color:var(--birch);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HUD */
.hud{display:flex;align-items:center;gap:14px;padding-block:8px;background:var(--pine);border-bottom:1px solid var(--line)}
.clock{display:flex;align-items:center;gap:8px;flex:none}
.clock svg{width:26px;height:26px}
.clock b{display:block;font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1}
.clock small{font-size:12px;color:var(--lichen);font-variant-numeric:tabular-nums;font-weight:700}
.needs{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 10px}
.need{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:5px;min-width:0}
.need span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lichen);white-space:nowrap}
.bar{grid-column:1/-1;height:7px;border-radius:99px;background:#0a120d;border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .3s}
.need.low span{color:var(--hp);animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.4}}
.lvl{flex:none;display:grid;justify-items:end;gap:3px}
.lvl b{font-family:var(--f-display);font-weight:400;font-size:15px}
.lvl .bar{width:64px}
@media (max-width:560px){.needs{grid-template-columns:repeat(2,minmax(0,1fr))}.clock b{font-size:15px}.lvl .bar{width:44px}}

/* Stage */
.stage{position:relative;overflow:hidden;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.vig{position:absolute;inset:0;pointer-events:none;transition:box-shadow .4s}
.goal{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));max-width:min(320px,calc(100% - 110px));background:rgba(10,18,13,.78);border:1px solid var(--line);border-radius:10px;padding:7px 11px;display:grid;gap:1px;pointer-events:none}
.goal small{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ember)}
.goal b{font-size:14px;font-weight:700;line-height:1.2}
.act{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;display:grid;justify-items:center;gap:6px}
.act-btn{width:84px;height:84px;border-radius:50%;border:3px solid #ffb27a;background:radial-gradient(circle at 40% 35%,#ffa765,var(--ember) 55%,#c2531a);color:#2a1206;font-family:var(--f-display);font-size:15px;box-shadow:0 5px 0 #7a320c,0 10px 24px rgba(0,0,0,.4);touch-action:none}
.act-btn:active,.act-btn.down{transform:translateY(3px);box-shadow:0 2px 0 #7a320c}
.act-btn.idle{filter:grayscale(.8) brightness(.6)}
.act-label{max-width:150px;text-align:center;font-size:13px;font-weight:800;background:rgba(10,18,13,.8);border:1px solid var(--line);padding:3px 10px;border-radius:99px}
.joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(236,230,211,.35);background:rgba(236,230,211,.07);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(236,230,211,.4)}
.joy-hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;font-size:12px;font-weight:700;color:var(--lichen);background:rgba(10,18,13,.7);padding:6px 10px;border-radius:8px;pointer-events:none;max-width:45%}
.toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:grid;gap:6px;width:min(360px,calc(100% - 32px));pointer-events:none;z-index:9}
.toast{background:var(--birch);color:var(--pine);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:tin .25s ease-out}
.toast.big{background:var(--ember);color:#2a1206;font-family:var(--f-display);font-size:19px;text-align:center}
.toast.big small{display:block;font-family:var(--f-body);font-size:13px;font-weight:700}
.toast.bad{background:var(--hp);color:#fff}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}

/* Overlay: pannelli, intro, morte */
.sheet{position:absolute;inset:0;background:rgba(14,25,18,.97);display:flex;flex-direction:column;z-index:6;animation:fade .2s ease-out}
@keyframes fade{from{opacity:.5}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.sheet-body{flex:1;overflow:auto;padding-block:14px 24px;display:grid;align-content:start;gap:10px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;font-size:15px;background:var(--ember);color:#2a1206;box-shadow:0 3px 0 #7a320c}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a320c}
.btn.ghost{background:var(--panel);color:var(--birch);box-shadow:0 3px 0 #08100b;border:1px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.recipe{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.recipe h4{margin:0;font-size:17px;font-weight:800}
.recipe p{margin:0;color:var(--lichen);font-size:14px;grid-column:1}
.recipe.owned{opacity:.6}
.cost{display:flex;gap:6px;flex-wrap:wrap;grid-column:1}
.cost span{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;background:#0f1a13;border:1px solid var(--line);border-radius:99px;padding:2px 9px 2px 4px;font-variant-numeric:tabular-nums}
.cost span.miss{color:var(--hp);border-color:#6a2a2c}
.cost svg{width:18px;height:18px}
.recipe .btn{grid-column:2;grid-row:1/4}
.label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--lichen);margin-top:6px}
.goals li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-weight:600}
.goals{list-style:none;margin:0;padding:0}
.goals li.done{color:var(--lichen);text-decoration:line-through}
.goals li.cur{color:var(--ember)}
.goals em{font-style:normal;font-size:13px;color:var(--xp);white-space:nowrap}
.modal{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(6,12,8,.72);padding-block:16px}
.modal .card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.card h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.05;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--ember)}
.card p{margin:0;color:var(--lichen);line-height:1.45}
.card ul{margin:0;padding-left:18px;color:var(--birch);line-height:1.6}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card .stats div{background:#0f1a13;border:1px solid var(--line);border-radius:10px;padding:8px;display:grid}
.card .stats b{font-family:var(--f-display);font-weight:400;font-size:22px}
.card .stats span{font-size:12px;color:var(--lichen);font-weight:700}

/* Zaino */
.pack{display:flex;align-items:center;gap:8px;padding-block:8px;background:var(--pine);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.pack::-webkit-scrollbar{display:none}
.pack .btn{flex:none;padding:9px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.pack .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.item{flex:none;position:relative;display:grid;justify-items:center;gap:1px;min-width:54px;padding:5px 6px;border-radius:10px;border:1px solid var(--line);background:var(--moss);font-size:11px;font-weight:700;color:var(--lichen)}
.item svg{width:24px;height:24px}
.item b{position:absolute;top:2px;right:5px;font-size:12px;color:var(--birch);font-variant-numeric:tabular-nums}
.item.eat{border-color:#5e6f35;background:#223520}
.item.eat::after{content:"mangia";font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--xp)}
.item.zero{opacity:.35}
.mapview{position:absolute;inset:0;z-index:7;background:rgba(10,18,13,.96);display:flex;flex-direction:column}
.map-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px}
.map-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.map-box{flex:1;min-height:0;display:grid;place-items:center;padding-block:4px}
#mapCv{border-radius:12px;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.4);touch-action:none}
.map-info{padding-block:8px 14px;display:grid;gap:8px}
.map-info p{margin:0;color:var(--birch);font-weight:700;font-size:14px}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:700;color:var(--lichen)}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.map-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.fish-btn{position:absolute;right:max(26px,calc(env(safe-area-inset-right,0px) + 26px));bottom:142px;width:64px;height:64px;border-radius:50%;border:3px solid #9fd8ec;background:radial-gradient(circle at 40% 35%,#7fd0ef,#3b8fb5 60%,#22607a);color:#fff;font-family:var(--f-display);font-size:14px;box-shadow:0 4px 0 #173f50,0 8px 20px rgba(0,0,0,.35)}
.fish-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #173f50}
.fishing{position:absolute;inset:0;z-index:7;background:#0b2229;overflow:hidden}
#fcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.f-top{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.f-top>*{pointer-events:auto}
.f-top b{font-family:var(--f-display);font-weight:400;font-size:20px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.f-hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;background:rgba(8,26,32,.78);padding:8px 14px;border-radius:99px;font-weight:700;font-size:14px;pointer-events:none}
.f-hint.alert{background:#f2c14e;color:#2a1206}
.f-power{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:grid;justify-items:center;gap:6px;pointer-events:none}
.f-track{position:relative;width:16px;height:150px;border-radius:99px;background:rgba(8,26,32,.78);border:1px solid var(--line);overflow:hidden}
.f-track i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,#6fe3b5,#f2c14e 70%,#ff5a36)}
.f-track span{position:absolute;left:0;right:0;top:0;height:10%;border-bottom:2px solid #fff;background:rgba(242,193,78,.25)}
.f-power small{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#fff}
.f-reel{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 32px));display:grid;gap:8px;background:rgba(8,26,32,.84);border:1px solid var(--line);border-radius:14px;padding:12px 14px;pointer-events:none}
.f-reel.hot{border-color:#ff5a36}
.f-row{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lichen)}
.f-bar{position:relative;height:12px;border-radius:99px;background:#0e3038;overflow:hidden}
.f-bar i{position:absolute;left:0;top:0;bottom:0;width:0}
#fTen{background:linear-gradient(90deg,#6fe3b5,#f2c14e 65%,#ff5a36 90%)}
#fProg{background:#ece6d3}
.f-bar .danger{position:absolute;left:85%;top:0;bottom:0;width:2px;background:#ff5a36}
.f-surge{justify-self:center;font-family:var(--f-display);color:#ff5a36;visibility:hidden}
.f-surge.on{visibility:visible}
.f-bite{position:absolute;font-family:var(--f-display);font-size:46px;color:#f2c14e;text-shadow:0 3px 0 #ff5a36;transform:translate(-50%,-100%);pointer-events:none}
.f-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:6px;justify-items:center;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.f-card canvas{width:240px;max-width:100%;height:100px}
.f-card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px}
.f-card p{margin:0;color:var(--lichen);line-height:1.4}
.f-card .rar{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.f-card .btn{margin-top:6px;min-width:150px}
input,textarea{user-select:text;-webkit-user-select:text}
.chat-btn{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));border:1px solid var(--line);background:rgba(10,18,13,.82);border-radius:10px;padding:7px 12px;font-weight:800;font-size:14px}
.chatbar{position:absolute;left:50%;bottom:122px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));display:flex;gap:8px;z-index:4}
.chatbar input,.chatform input{flex:1;min-width:0;background:#0f1a13;color:var(--birch);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:16px}
.chatform{display:flex;gap:8px}
.chatlog{max-height:220px;overflow:auto;display:grid;gap:4px}
.chatlog p{margin:0;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.chatlog b{color:#9fc9ff;margin-right:4px}
.chatlog b.me{color:var(--ember)}
p.meta{margin:0;color:var(--lichen);font-size:14px}
.people,.board{list-style:none;margin:0;padding:0;display:grid}
.people li,.board li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.people span,.board span{color:var(--lichen);font-size:13px;font-variant-numeric:tabular-nums}
.board .pos{font-family:var(--f-display);color:var(--birch);min-width:22px}
.board li.me b{color:var(--ember)}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.slot.empty{border-style:dashed;background:transparent}
.slot h4{margin:0;font-size:17px;font-weight:800}
.slot .meta{color:var(--lichen);font-size:14px;font-variant-numeric:tabular-nums}
.slot .row{display:flex;gap:8px;flex-wrap:wrap}
.slot .btn{padding:8px 14px;font-size:14px}
.slot .ask{color:var(--ember);font-weight:700;font-size:14px}
.where{margin:0;color:var(--lichen);display:flex;gap:8px;align-items:flex-start}
.where b{color:var(--birch)}
.who{margin:0;display:flex;align-items:center;gap:10px;background:#0f1a13;border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--lichen);font-size:14px}
.who img{width:30px;height:30px;border-radius:50%;flex:none}
.who b{color:var(--birch)}
.nick{display:grid;gap:6px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--lichen)}
.nick input{background:#0f1a13;color:var(--birch);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:17px;text-transform:none;letter-spacing:0;font-weight:700}
.paste{display:grid;gap:8px}
.paste summary{cursor:pointer;color:var(--lichen);font-size:14px;font-weight:700}
.paste textarea{width:100%;min-height:70px;background:#0f1a13;color:var(--birch);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px ui-monospace,monospace;resize:vertical}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="hud gut">
    <div class="clock"><svg id="clockIco" viewBox="0 0 24 24"></svg><div><b id="dayTxt">Giorno 1</b><small id="hourTxt">06:00</small></div></div>
    <div class="needs">
      <div class="need" id="n-hp"><span>Salute</span><div class="bar"><i style="background:var(--hp)"></i></div></div>
      <div class="need" id="n-food"><span>Fame</span><div class="bar"><i style="background:var(--food)"></i></div></div>
      <div class="need" id="n-water"><span>Sete</span><div class="bar"><i style="background:var(--water)"></i></div></div>
      <div class="need" id="n-warm"><span>Calore</span><div class="bar"><i style="background:var(--warm)"></i></div></div>
    </div>
    <div class="lvl"><b id="lvTxt">Liv. 1</b><div class="bar"><i id="xpFill" style="background:var(--xp);width:0"></i></div></div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Il bosco"></canvas>
    <div class="vig" id="vig"></div>
    <div class="goal" id="goal"><small>Obiettivo</small><b id="goalTxt"></b></div>
    <div class="joy" id="joy" hidden><i id="knob"></i></div>
    <div class="joy-hint" id="joyHint">Trascina a sinistra per muoverti · Tastiera: WASD e E</div>
    <div class="act"><button class="act-btn idle" id="actBtn" type="button">Usa</button><span class="act-label" id="actLabel">Niente qui vicino</span></div>
    <button class="fish-btn" id="fishBtn" type="button" hidden>Pesca</button>
    <section class="mapview" id="mapView" hidden>
      <div class="map-head gut"><h2>Mappa del bosco</h2><button class="btn ghost" id="mapClose" type="button">Chiudi</button></div>
      <div class="map-box gut" id="mapBox"><canvas id="mapCv" aria-label="Mappa del bosco"></canvas></div>
      <div class="map-info gut">
        <p id="mapNote"></p>
        <div class="map-legend">
          <span><i style="background:#ff8a3d"></i>Tu</span><span><i style="background:#4fa3e8"></i>Altri giocatori</span>
          <span><i style="background:#9a6a3c"></i>Le tue costruzioni</span><span><i style="background:#9a6a3c;outline:2px solid #4fa3e8"></i>Villaggi degli altri</span>
          <span><i style="background:#ffb000;border-radius:50%"></i>Falò</span><span><i style="background:#1f566a"></i>Acqua</span><span><i style="background:#163a22;border-radius:50%"></i>Alberi</span>
        </div>
      </div>
    </section>
    <section class="fishing" id="fishing" hidden>
      <canvas id="fcv" aria-label="Il lago: tieni premuto per lanciare"></canvas>

function update(dt) {

    if (ml > 1) { mx /= ml; my /= ml; }
    const sp = 150 * (S.hp < 25 ? 0.75 : 1);

  S.water -= dt * 100 / 170 * (S.tools.borraccia ? 0.65 : 1);
  if (nearFire) S.warm += dt * 18;
  else if (dk > 0.45) S.warm -= dt * 100 / 75 * (S.tools.mantello ? 0.5 : 1) * (S.tools.maglione ? 0.6 : 1) * (nearShelter ? 0.4 : 1);

  // fuochi

  // cespugli e funghi
  for (const o of objects) { o.sh = Math.max(0, o.sh - dt); if (o.k === 'bush' && o.berries <= 0) { o.rg -= dt; if (o.rg <= 0) o.berries = 3; } }

    .catch(e => { S.inv[item]++; toast(e && e.code === 'not_permitted' ? 'Per fare regali serve almeno il livello Collaboratore.' : 'Regalo non consegnato. Riprova.', 'bad'); });
}
function onGift(m) {
  const d = m.data || {};
  if (m.isMe || !Net.myPeer || d.to !== Net.myPeer || !GIFTABLE.includes(d.item)) return;
  const now = Date.now(); if (now - (Net.giftAt[m.peer] || 0) < 700) return; Net.giftAt[m.peer] = now;
  S.inv[d.item]++; addXP(2);
  toast(`<b>${esc(nameOf(m))}</b> ti ha regalato 1 ${esc(ITEMS[d.item].n.toLowerCase())}!`);
}
function onGone(m) {
  if (m.sameTab || !S.community) return;
  const id = m.data && m.data.id; if (!Number.isInteger(id)) return;
  const i = objects.findIndex(o => o.id === id);
  if (i >= 0) { const o = objects[i]; objects.splice(i, 1); solidCache = solids(); chips(o.x, o.y - 10, '#d9a86c', 3); }
}
function startCommunity() {
  freshRun(COMMUNITY_SEED); S.community = true;
  solidCache = solids(); save(); G.resumed = true; G.packDirty = null; Net.chat = []; Net.bubbles = {};
  toast('Sei nel bosco della comunità. Gli altri esploratori hanno la giacca blu.');
}
async function submitScore() {
  if (!S) return;
  try {
    if (S.dead) { const c = myCode(); if (c) await api('save', { code: c, nick: myNick(), save: slotBody() }); }
    const code = myCode() || await onlineSave(true);
    if (code) await api('score', { code, nick: myNick(), days: day(), level: S.level, wolves: S.c.wolf });
  } catch (e) {}
}
async function loadBoard() {
  try {
    const j = await api('scores' + (myCode() ? '?code=' + encodeURIComponent(myCode()) : ''));
    Net.board = (j.rows || []).map(r => ({ ...r, name: r.nick, id: r.me ? 'me' : 'x' }));
  } catch (e) { Net.board = []; }
  if (G.sheetMode === 'community') drawCommunity();
}
function drawCommunity() {
  const inp = $('sheetChatIn'), draft = inp ? inp.value : '', hadFocus = inp && document.activeElement === inp;
  const peers = Net.peers;
  let forest;
  if (S.community) {
    forest = Net.room && Net.room.connected()
      ? `<div class="slot"><h4>Sei nel bosco della comunità</h4><div class="meta">${peers.length ? `Qui ora ${peers.length === 1 ? 'c’è 1 altro esploratore' : `ci sono ${peers.length} esploratori`}. Avvicinati a qualcuno per regalargli cibo o legna con il pulsante arancione, e scaldatevi allo stesso falò.` : 'Per ora sei da solo. Quando arriva qualcuno lo vedi nel bosco con la giacca blu e il suo nome sopra la testa.'}</div>
        ${peers.length ? `<ul class="people">${peers.map(p => { const pr = p.presence || {}; return `<li><b>${esc(nameOf(p))}</b><span>${pr.dead ? 'è caduto' : `giorno ${isNum(pr.d) ? pr.d : '?'} · liv. ${isNum(pr.lv) ? pr.lv : '?'}`}${isNum(pr.x) && isNum(pr.y) ? ` · a ${Math.round(Math.hypot(pr.x - S.x, pr.y - S.y) / T)} passi da te` : ''}</span></li>`; }).join('')}</ul>` : ''}</div>`
      : `<div class="slot"><h4>Bosco della comunità</h4><div class="meta">${Net.joinFailed || !Net.lobby ? 'In questa vista non riesco a collegarti agli altri. Apri il gioco da claude.ai con il tuo account: per giocare insieme il gioco deve esserti stato condiviso.' : 'Mi sto collegando agli altri esploratori…'}</div></div>`;
  } else {
    forest = `<div class="slot"><h4>Gioca con gli altri</h4><div class="meta">Ora sei in un bosco tutto tuo. Nel bosco della comunità tutti esplorano la stessa mappa: vi vedete, vi scaldate allo stesso falò, vi regalate cibo e chiacchierate in chat.</div>
      <div class="row">${confirmAsk && confirmAsk.act === 'community' ? `<span class="ask">La partita attuale (giorno ${day()}) verrà chiusa. Vuoi salvarla prima in uno slot?</span><button class="btn" data-yes type="button">Entra senza salvare</button><button class="btn ghost" data-go-saves type="button">Prima salvo</button>` : '<button class="btn" data-community type="button">Entra nel bosco della comunità</button>'}</div></div>`;
  }
  const chat = S.community && Net.room ? `<div class="label">Chat del bosco</div><div class="slot"><div class="chatlog" id="chatLog">${Net.chat.length ? Net.chat.slice(-30).map(c => `<p><b class="${c.me ? 'me' : ''}">${esc(c.me ? 'Tu' : nameOf(c))}</b>${esc(c.t)}</p>`).join('') : '<p class="meta">Ancora nessun messaggio. Saluta chi c’è!</p>'}</div>
    <form class="chatform" id="sheetChat"><input id="sheetChatIn" maxlength="140" autocomplete="off" placeholder="Scrivi a tutto il bosco"><button class="btn" type="submit">Invia</button></form></div>` : '';
  const board = Net.board === null ? '<p class="meta">Carico la classifica…</p>'
    : !Net.board.length ? `<p class="meta">${Cloud.rdb ? 'Nessuno in classifica per ora. Supera la prima notte per entrarci.' : 'La classifica si vede aprendo il gioco da claude.ai con il tuo account.'}</p>`
    : `<ol class="board">${Net.board.map((r, i) => `<li class="${r.id === Cloud.uid ? 'me' : ''}"><span class="pos">${i + 1}</span><b>${esc(r.name || (r.id === Cloud.uid ? 'Tu' : 'Un esploratore'))}</b><span>giorno ${isNum(r.days) ? r.days : '?'} · liv. ${isNum(r.level) ? r.level : '?'} · ${isNum(r.wolves) ? r.wolves : 0} lupi</span></li>`).join('')}</ol>`;
  $('sheetBody').innerHTML = whoHtml() + forest + chat + `<div class="label">Classifica dei sopravvissuti</div><div class="slot">${board}</div>`;
  const log = $('chatLog'); if (log) log.scrollTop = log.scrollHeight;
  const ni = $('sheetChatIn'); if (ni) { ni.value = draft; if (hadFocus) ni.focus(); }
}
$('sheetBody').addEventListener('submit', e => {
  if (e.target.id !== 'sheetChat') return;
  e.preventDefault();
  const inp = $('sheetChatIn'); sendChat(inp.value).then(ok => { if (ok) { const i = $('sheetChatIn'); if (i) i.value = ''; } });
});
$('chatBtn').addEventListener('click', () => { const bar = $('chatBar'); bar.hidden = !bar.hidden; if (!bar.hidden) $('chatIn').focus(); });
$('chatBar').addEventListener('submit', e => {
  e.preventDefault();
  sendChat($('chatIn').value).then(ok => { if (ok) { $('chatIn').value = ''; $('chatBar').hidden = true; $('chatIn').blur(); } });
});
$('chatIn').addEventListener('keydown', e => { if (e.key === 'Escape') { $('chatBar').hidden = true; e.target.blur(); } });

/* ---------- Versione web: soprannome, codice di recupero, classifica e comunità via /api ---------- */
const NICK_KEY = 'ultimo-falo-nick', CODE_KEY = 'ultimo-falo-code';
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
const myNick = () => lsGet(NICK_KEY) || 'Esploratore';
const myCode = () => lsGet(CODE_KEY);
function setNick(v) { const n = String(v || '').replace(/[<>&"']/g, '').replace(/\s+/g, ' ').trim().slice(0, 16); if (n) lsSet(NICK_KEY, n); }
async function api(path, body) {
  const res = await fetch('/api/' + path, body === undefined ? {} : { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(j.error || 'HTTP ' + res.status); e.status = res.status; throw e; }
  return j;
}
let onlineBusy = false;
async function onlineSave(quiet) {
  if (!S || S.dead || onlineBusy) return null;
  onlineBusy = true;
  try {
    const had = myCode();
    const j = await api('save', { code: had, nick: myNick(), save: slotBody() });
    if (j.code && j.code !== had) { lsSet(CODE_KEY, j.code); toast(`Il tuo codice di recupero è <b>${esc(j.code)}</b><small>Scrivilo da qualche parte: lo trovi sempre in Salva.</small>`, 'big'); }
    else if (!quiet) toast('Partita salvata online.');
    if (G.sheetMode === 'saves') drawSaves();
    return j.code || null;
  } catch (e) {
    if (!quiet) toast(e.status === 429 ? 'Troppe richieste: riprova tra un minuto.' : 'Salvataggio online non riuscito. Controlla la connessione.', 'bad');
    return null;
  } finally { onlineBusy = false; }
}
async function recoverCode(raw) {
  const code = String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
  if (!/^FALO-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) { toast('Il codice ha questa forma: FALO-XXXX-XXXX.', 'bad'); return; }
  try {
    const j = await api('load?code=' + encodeURIComponent(code));
    if (!j.save || !restore(j.save.json)) { toast('Questa partita non si può riprendere: era già finita.', 'bad'); return; }
    lsSet(CODE_KEY, code); if (j.nick) setNick(j.nick);
    solidCache = solids(); save(); G.packDirty = null; G.resumed = true; G.fromIntro = false; closeSheet();
    toast(`Partita recuperata: giorno ${day()}, livello ${S.level}.`);
  } catch (e) {
    toast(e.status === 404 ? 'Nessuna partita con questo codice. Controlla di averlo scritto bene.' : 'Recupero non riuscito. Controlla la connessione e riprova.', 'bad');
  }
}
function codeBox() {
  const code = myCode();
  return `<div class="label">Codice di recupero</div>
    <div class="slot"><h4>${code ? esc(code) : 'Non hai ancora un codice'}</h4>
      <div class="meta">${code ? 'Con questo codice riprendi la partita su qualsiasi telefono o computer. La partita si salva online da sola ogni minuto. Scrivilo da qualche parte: senza codice non si può recuperare.' : 'Il codice arriva da solo dopo il primo minuto di gioco, oppure crealo adesso. Ti serve per riprendere la partita su un altro dispositivo.'}</div>
      <div class="row">${!G.fromIntro ? `<button class="btn" data-online-save type="button">${code ? 'Salva online adesso' : 'Crea il mio codice'}</button>` : ''}${code ? '<button class="btn ghost" data-copy-code type="button">Copia il codice</button>' : ''}</div>
      <div class="chatform"><input id="codeIn" maxlength="14" autocomplete="off" placeholder="FALO-XXXX-XXXX" aria-label="Codice di recupero"><button class="btn ghost" data-recover type="button">Recupera</button></div>
    </div>`;
}
// Stessa interfaccia della stanza di claude.ai (onPeers, on, emit, presence), ma via /api/sync ogni 2 secondi.
function makeWebLobby() {
  return { join: async () => {
    const myId = Math.random().toString(36).slice(2, 12);
    const peerFns = [], topicFns = {}, peersMap = new Map(), seen = new Set(), goneSeen = new Set();
    let pres = null, queue = [], gone = [], since = 0, conn = false, alive = true, inflight = false, villageV = -1;
    const fire = (topic, m) => (topicFns[topic] || []).forEach(fn => { try { fn(m); } catch (e) { console.error(e); } });
    function applyPeers(list) {
      const ids = new Set(), joined = [], left = [];
      for (const p of list) {
        if (!p || p.id === myId) continue;
        ids.add(p.id); Net.names[p.id] = p.nick || '';
        const pr = p.pres || {};
        let o = peersMap.get(p.id);
        if (!o) { o = { peer: p.id, by: p.id, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: { ...pr }, target: pr }; peersMap.set(p.id, o); joined.push(o); }
        else { const { x, y } = o.presence; Object.assign(o.presence, pr); if (isNum(x)) { o.presence.x = x; o.presence.y = y; } o.target = pr; }
        if (Array.isArray(pr.g)) for (const gid of pr.g) { const k = p.id + ':' + gid; if (!goneSeen.has(k)) { goneSeen.add(k); fire('gone', { topic: 'gone', data: { id: gid }, peer: p.id, by: p.id, isMe: false, sameTab: false }); } }
      }
      for (const [id, o] of peersMap) if (!ids.has(id)) { peersMap.delete(id); left.push(o); }
      const all = [...peersMap.values(), { peer: myId, by: myId, isMe: true, sameTab: true, kind: 'viewer', presence: pres || {} }];
      peerFns.forEach(fn => fn({ peers: all, joined, left, updated: [] }));
    }
    async function sync() {
      if (inflight || !alive) return;
      inflight = true;
      const now = Date.now();
      gone = gone.filter(g => now - g.t < 15000);
      const events = queue.splice(0, 5);
      try {
        const j = await api('sync', { id: myId, owner: S && S.owner, nick: myNick(), pres: pres ? { ...pres, g: gone.map(g => g.id) } : null, events, since, bv: villageV });
        conn = true; since = j.now - 8000;
        applyPeers(j.peers || []);
        if (j.builds) { villageV = j.bv; fire('village', { topic: 'village', data: j.builds }); }
        for (const e of j.events || []) {
          if (!e || seen.has(e.k)) continue;
          seen.add(e.k); Net.names[e.from] = e.nick || '';
          fire(e.topic, { topic: e.topic, data: e.data, peer: e.from, by: e.from, isMe: e.from === myId, sameTab: e.from === myId, kind: 'viewer' });
        }
        if (seen.size > 400) [...seen].slice(0, 200).forEach(k => seen.delete(k));
        if (goneSeen.size > 2000) goneSeen.clear();
      } catch (e) { conn = false; queue = events.concat(queue); }
      finally { inflight = false; }
    }
    const timer = setInterval(() => { if (!document.hidden) sync(); }, 2000);
    const bye = () => { try { navigator.sendBeacon('/api/sync', new Blob([JSON.stringify({ id: myId, leave: true })], { type: 'application/json' })); } catch (e) {} };
    window.addEventListener('pagehide', bye);
    sync();
    return {
      onPeers(fn) { peerFns.push(fn); return () => {}; },
      on(topic, fn) { (topicFns[topic] = topicFns[topic] || []).push(fn); return () => {}; },
      emit(topic, data) {
        if (topic === 'gone') { gone.push({ id: data.id, t: Date.now() }); return Promise.resolve(); }
        queue.push({ topic, data }); setTimeout(sync, 30); return Promise.resolve();
      },
      presence(p) { pres = p; return Promise.resolve(); },
      connected: () => conn,
      smooth(dt) {
        for (const o of peersMap.values()) {
          const t = o.target || {};
          if (!isNum(t.x) || !isNum(t.y)) continue;
          if (!isNum(o.presence.x) || Math.hypot(t.x - o.presence.x, t.y - o.presence.y) > 400) { o.presence.x = t.x; o.presence.y = t.y; continue; }
          const k = Math.min(1, dt * 3);
          o.presence.x += (t.x - o.presence.x) * k; o.presence.y += (t.y - o.presence.y) * k;
        }
      },
      leave() { alive = false; clearInterval(timer); window.removeEventListener('pagehide', bye); bye(); return Promise.resolve(); },
    };
  } };
}

/* ---------- Avvio ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  const paused = G.sheet || G.modal || document.hidden || S.dead || F.open || G.mapOpen;
  if (G.mapOpen) { G.mapT = (G.mapT || 0) - dt; if (G.mapT <= 0) { G.mapT = 0.1; drawMap(); } }
  if (F.open && !document.hidden) { fishUpdate(dt); fishDraw(); }
  if (!paused) { update(dt); G.hit = Math.max(0, (G.hit || 0) - dt); G.saveT += dt; if (G.saveT > 5) { G.saveT = 0; save(); } G.cloudT = (G.cloudT || 0) + dt; if (G.cloudT > 45) { G.cloudT = 0; cloudAuto(); } }
  netTick(dt);
  if (W && H) draw(S.time);
  G.uiT -= dt; if (G.uiT <= 0) { G.uiT = 0.1; hud(); }
  if (!paused && G.packDirty !== JSON.stringify(S.inv)) { G.packDirty = JSON.stringify(S.inv); renderPack(); }
  requestAnimationFrame(frame);
}
function start(data) {
  let resumed = false;
  if (data && data.run && restore(data.run)) resumed = 'hot';
  else { let raw = null; try { raw = localStorage.getItem(SAVE); } catch (e) {} if (raw && restore(raw)) resumed = true; else freshRun(); }
  solidCache = solids();
  resize(); renderPack(); hud();
  G.resumed = !!resumed;
  if (resumed !== 'hot') intro(resumed);
  initCloud(); initNet();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ run: serialize() }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
